<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Play DOOM</title>
  <script src="https://js-dos.com/6.22/current/js-dos.js"></script>
</head>
<body>
  <canvas id="jsdos" width="640" height="400"></canvas>
  <script>
    Dos(document.getElementById("jsdos")).ready((fs, main) => {
      fs.extract("doom1.wad").then(() => {
        main(["doom.exe", "-iwad", "doom1.wad"]);
      });
    });
  </script>
</body>
</html>
